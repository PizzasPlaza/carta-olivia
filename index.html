<meta name="apple-mobile-web-app-capable" content="yes">

<title>Carta · Olivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Oswald:wght@400;500&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   CONFIGURACIÓN
   Enlace de tu Google Sheet (Archivo → Compartir → Publicar en la web
   → Documento completo → Microsoft Excel .xlsx). Si lo dejas vacío,
   la carta lo pide la primera vez.
   ============================================================ */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCPG2cMUR_GVh0or7rrN7qz66vUfIxMythRDRYzyI6GKMc-ggorHvxTKIOzdbtkw/pub?output=xlsx";
const IDLE_MS = 120000;          // 2 min sin tocar = nuevo cliente
const REFRESH_MS = 5 * 60000;    // recarga de la hoja
</script>
<style>
:root{
  --ground:#f3f2ec; --surface:#ffffff; --raise:#ecede4; --line:#d6d8cb; --band:#dadccf;
  --text:#25261f; --muted:#696b5e; --accent:#4e5a38; --accent-ink:#ffffff; --bad:#b04a32;
  --tinto:#7a1f2c; --blanco:#cdb85e; --rosado:#d98a7a; --espumoso:#b99b3a;
  --display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --cond:"Oswald","Tw Cen MT Condensed","Arial Narrow",sans-serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;user-select:none;padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.top{display:flex;align-items:center;gap:14px 22px;padding:12px 24px;background:var(--band);flex-wrap:wrap}
.body{padding-inline:24px}
.brand{display:flex;flex-direction:column;line-height:1;background:none;border:0;padding:0;text-align:left}
.brand img{width:84px;height:84px;display:block}
.tabs{display:flex;gap:4px;background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:4px;margin-right:auto}
.tab{height:52px;padding:0 28px;border-radius:999px;border:0;background:none;font-family:var(--cond);font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.search{flex:1 1 220px;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 18px;height:52px}
.search input{background:none;border:0;outline:0;width:100%;user-select:text}
.btn{height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.promo{border-color:var(--accent);color:var(--accent);background:var(--surface);font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;font-size:17px}
.btn.icon{width:48px;padding:0;background:none}
.body{display:grid;grid-template-columns:270px 1fr;gap:28px;min-height:0}
aside.filters{overflow:auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
.fgroup h3{margin:0 0 10px;font-family:var(--cond);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-size:17px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
select.sel{width:100%;height:50px;font-size:17px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:0 12px}
.range{display:flex;flex-direction:column;gap:6px}
.range input{width:100%;accent-color:var(--accent)}
.range output{font-family:var(--mono);font-size:16px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;text-align:left;font-size:17px;text-decoration:underline;text-underline-offset:4px}
main.list{overflow:auto;padding-block:20px 60px;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));min-width:0}
.summary{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.summary h2{font-family:var(--display);font-weight:500;font-size:44px;margin:0;line-height:1}
.summary span{color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{display:grid;grid-template-columns:84px 1fr;gap:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;position:relative;transition:transform .15s}
.card:active{transform:scale(.985)}
.bottle,.glass{width:84px;height:170px}
.cphoto{width:84px;height:182px;object-fit:cover;border-radius:12px;display:block;background:var(--raise)}
.detail .cphoto{width:180px;height:380px;border-radius:16px}
.credit{margin-top:24px;font-size:13px;color:var(--muted)}
.photo{width:84px;height:182px;object-fit:contain;display:block;mix-blend-mode:multiply}
.card .meta{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-family:var(--cond);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card h4{font-family:var(--cond);font-weight:500;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;margin:4px 0 4px;text-wrap:balance;padding-right:8px}
.card .sub{font-size:16px;color:var(--muted)}
.card .origen{font-size:16px;margin-top:6px}
.prices{display:flex;gap:14px;margin-top:auto;padding-top:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.prices div{display:flex;flex-direction:column;font-size:21px;font-weight:500}
.prices small{font-family:var(--cond);font-size:12px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.badge{position:absolute;bottom:16px;right:14px;font-family:var(--cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:var(--surface)}
.notice{margin:60px auto;max-width:50ch;text-align:center;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:5000!important;background:rgba(37,38,31,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px;width:min(860px,100%);max-height:calc(100% - 24px);overflow:auto;padding:28px;position:relative}
.close{position:absolute;top:14px;right:14px}
.detail{display:grid;grid-template-columns:180px 1fr;gap:32px}
.detail .bottle,.detail .glass,.detail .photo{width:180px;height:380px}
.detail h2{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.05;margin:4px 0;text-wrap:balance;padding-right:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:18px 0;font-size:18px}
.kv dt{color:var(--muted);font-family:var(--cond);font-size:14px;letter-spacing:.12em;text-transform:uppercase;align-self:center}
.kv dd{margin:0}
.body-scale{display:flex;gap:4px}
.body-scale i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.body-scale i.on{background:var(--accent)}
.detail h5{margin:20px 0 6px;font-family:var(--cond);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.detail p{margin:0;max-width:60ch;font-size:20px;font-weight:300}
.detail .prices div{font-size:30px}
.detail .prices{gap:28px;margin-top:22px}
/* promo */
.promo-card{position:relative;width:auto;max-width:min(420px,86vw);background:var(--surface);border-radius:18px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.35);cursor:pointer}
.promo-card .promo-img{display:block;max-width:100%;max-height:min(58vh,520px);width:auto;height:auto;margin:0;border-radius:12px;object-fit:contain}
.promo-card .promo-txt{padding:34px 26px 26px;text-align:center;min-width:280px}
.promo-card .promo-txt h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.05;margin:8px 0}
.promo-card .promo-txt p{font-size:18px;margin:0}
.promo-card .promo-txt .price{font-family:var(--mono);font-size:28px;margin-top:12px}
.promo-x{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--text);color:var(--surface);font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:2}
.promo-bar{position:absolute;left:18px;right:18px;bottom:4px;height:3px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden}
.promo-bar i{display:block;height:100%;width:0;background:var(--accent)}
.promo-sheet{width:min(560px,100%);text-align:center;padding:40px 32px 28px;background:
  radial-gradient(120% 80% at 50% 0%, var(--band), transparent 70%), var(--surface);border-color:var(--accent)}
.promo-sheet .eyebrow{color:var(--accent)}
.promo-img{display:block;max-width:100%;max-height:62vh;margin:0 auto 6px;border-radius:14px;object-fit:contain}
.promo-sheet:has(.promo-img){padding-top:52px}
.promo-sheet h2{font-family:var(--display);font-weight:600;font-size:54px;line-height:1.05;margin:10px 0 10px;text-wrap:balance}
.promo-sheet p{font-size:21px;font-weight:300;margin:0 auto;max-width:40ch}
.promo-sheet .price{font-family:var(--mono);font-size:34px;margin-top:16px}
.promo-sheet .when{color:var(--muted);font-size:14px;margin-top:10px}
.pdots{display:flex;justify-content:center;gap:8px;margin-top:22px}
.pdots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);padding:0}
.pdots button[aria-current="true"]{background:var(--accent)}
.promo-sheet .actions{justify-content:center;margin-top:22px}
.setup{width:min(560px,100%)}
.setup h2{font-family:var(--display);font-weight:600;font-size:40px;margin:0 0 8px}
.setup ol{color:var(--muted);padding-left:20px;margin:0 0 16px}
.setup input{width:100%;height:48px;border-radius:12px;background:var(--ground);border:1px solid var(--line);padding:0 12px;user-select:text}
.setup .err{color:var(--bad);min-height:22px;font-size:14px;margin-top:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
/* ---- vistas vinos ---- */
.summary{justify-content:space-between}
.summary .left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.views button{height:44px;padding:0 18px;border:0;border-radius:999px;background:none;font-family:var(--cond);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.views button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.cava{border-radius:22px;padding:26px 0 10px;background:
  radial-gradient(ellipse 70% 60% at 50% 0%, rgba(255,250,230,.22), transparent 70%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 64px),
  linear-gradient(#4f5b3a,#3a442b);box-shadow:inset 0 0 80px rgba(0,0,0,.35)}
.shelf{margin-bottom:26px}
.shelf h3{margin:0 26px 6px;font-family:var(--cond);font-weight:500;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#eef0e2;display:flex;gap:10px;align-items:center}
.shelf h3 small{font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;color:#c9cfb6}
.rack{position:relative;display:flex;gap:30px;overflow-x:auto;padding:14px 30px 0;scroll-snap-type:x proximity;scrollbar-width:none}
.rack::-webkit-scrollbar{display:none}
.slot{flex:none;width:124px;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;scroll-snap-align:start;color:#f3eadb}
.slot .b{height:290px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse 60% 55% at 50% 62%,rgba(255,250,230,.16),transparent 70%)}
.slot .b img,.mcard .b img{mix-blend-mode:normal!important}
.slot .b img,.slot .b svg{height:var(--bh,280px);width:auto;max-width:120px;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(0,0,0,.35));transition:transform .18s,filter .18s;transform-origin:50% 100%}
.slot:hover .b img,.slot:hover .b svg,.slot:focus-visible .b img,.slot:focus-visible .b svg{transform:translateY(-10px) scale(1.07);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45))}
.slot:active .b img,.slot:active .b svg{transform:translateY(-10px) scale(1.07);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45))}
.slot:hover .n,.slot:active .n{color:#fff}
.card:hover{border-color:var(--accent)}
.card:hover .photo,.card:active .photo{transform:scale(1.06)}
.photo{transition:transform .18s}
.plank{height:22px;background:linear-gradient(#e4c9a0,#c49f6f 45%,#9c774b);box-shadow:0 8px 14px rgba(0,0,0,.35);border-top:1px solid #f1dcb9}
.prices-row{display:flex;gap:34px;padding:10px 30px 0;overflow:hidden}
.slot .p{margin-top:14px;font-family:var(--mono);font-size:19px;color:#fff}
.slot .n{font-family:var(--cond);font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#e9ecdc;text-align:center;line-height:1.15;margin-top:2px;max-width:124px}
.rackwrap{position:relative}
.rackwrap .plank{position:absolute;left:0;right:0;top:302px}
#map{height:calc(100vh - 250px);min-height:420px;border-radius:22px;overflow:hidden;background:#1d2a33}
.mapbar{position:absolute;z-index:500;top:14px;left:14px;display:flex;gap:8px}
.mapbar button{height:46px;padding:0 18px;border-radius:999px;border:0;background:rgba(20,22,18,.78);color:#fff;font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;font-size:16px}
.pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);white-space:nowrap}
.pin .lbl{background:rgba(20,22,18,.82);color:#fff;border-radius:8px;padding:5px 9px;text-align:center;font-family:var(--cond);font-size:15px;letter-spacing:.03em;line-height:1.1}
.pin .lbl small{display:block;font-family:var(--body);font-size:11px;color:#d8d8cf;letter-spacing:0}
.pin.sel .lbl{background:#4e5a38}
.pin .drop{width:30px;height:38px;margin-top:4px}
.mapwrap{position:relative;z-index:0;isolation:isolate}
.mapcards{position:absolute;z-index:600;left:0;right:0;bottom:0;display:flex;gap:14px;overflow-x:auto;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.55) 35%);scrollbar-width:none}
.mapcards::-webkit-scrollbar{display:none}
.mcard{flex:none;width:250px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:16px;padding:10px 14px;text-align:left}
.mcard .b img,.mcard .b svg{height:120px;width:62px;object-fit:contain}
.mcard b{font-family:var(--cond);font-weight:500;font-size:19px;text-transform:uppercase;display:block;line-height:1.1}
.mcard span{font-size:14px;color:var(--muted);display:block}
.mcard .pr{font-family:var(--mono);font-size:17px;color:var(--text);margin-top:6px}
.leaflet-container{font-family:var(--body)}
.bhead{display:flex;align-items:baseline;gap:10px;font-family:var(--cond);font-weight:500;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.bhead small{font-family:var(--body);font-size:15px;letter-spacing:0;color:var(--muted)}
/* ---- platillos ---- */
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 22px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-family:var(--cond);font-size:22px;letter-spacing:.02em;text-transform:uppercase;color:var(--text)}
.drow .go{font-family:var(--body);font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent);white-space:nowrap}
.drow:active{background:var(--raise)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.dcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;min-height:210px}
.dcard h4{font-family:var(--cond);font-weight:500;font-size:25px;text-transform:uppercase;line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.dcard p{margin:0;font-size:16px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dcard .foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:14px;gap:10px}
.dcard .price{font-family:var(--mono);font-size:21px;font-weight:500}
.pairs{display:flex;align-items:flex-end;gap:2px}
.pairs img,.pairs svg{height:58px;width:auto;max-width:26px;object-fit:contain}
.pairs .cph{width:40px;height:40px;border-radius:50%;object-fit:cover;margin-left:6px;border:2px solid var(--surface)}
.pairs small{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:8px;align-self:center}
.dish-head{padding-right:48px}
.dish-head h2{font-family:var(--display);font-weight:600;font-size:50px;line-height:1.02;margin:6px 0 8px;text-wrap:balance}
.dish-head p{margin:0;font-size:19px;font-weight:300;max-width:56ch}
.dish-head .price{font-family:var(--mono);font-size:30px}
.dish-img{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:18px}
.pair-sec h5{margin:26px 0 12px;font-family:var(--cond);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
.prow{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.pcard{flex:none;width:230px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;background:var(--ground);border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-align:left}
.pcard .b img,.pcard .b svg{height:130px;width:62px;object-fit:contain;mix-blend-mode:normal}
.pcard .cphoto{width:62px;height:90px;border-radius:10px}
.pcard b{font-family:var(--cond);font-weight:500;font-size:19px;text-transform:uppercase;line-height:1.1;display:block}
.pcard span{display:block;font-size:14px;color:var(--muted)}
.pcard .pr{font-family:var(--mono);font-size:16px;color:var(--text);margin-top:6px}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.dchip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--ground);font-size:15px}
.backdish{display:inline-flex;align-items:center;gap:6px;margin-top:20px;background:none;border:0;color:var(--accent);font-size:17px;text-decoration:underline;text-underline-offset:4px}
@media (max-width:820px){
  .body{grid-template-columns:1fr}
  aside.filters{padding-block:14px 0;flex-direction:row;overflow-x:auto;gap:18px}
  .fgroup{flex:none}
  .hide-sm{display:none}
  .detail{grid-template-columns:1fr}

/* ---------- Carga de la hoja ---------- */
const sheetUrl=()=>(store.get("olivia_sheet_url")||SHEET_URL||"").trim();
function xlsxUrl(u){
  if(/\/spreadsheets\/d\/e\//.test(u)) return u.replace(/\/pub(html)?(\?.*)?$/,"")+"/pub?output=xlsx";
  const m=u.match(/\/spreadsheets\/d\/([^/?#]+)/);
  return m?`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`:u;
}
function rows(wb,name){
  const sn=wb.SheetNames.find(n=>norm(n)===name); if(!sn) return [];
  return XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:"",raw:true}).map(r=>{const o={};for(const k in r)o[norm(k)]=r[k];return o;});
}
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const vinos=rows(wb,"vinos").map((r,i)=>({id:"v"+i,foto:imgUrl(txt(r.foto)),nombre:txt(r.nombre),bodega:txt(r.bodega),tipo:TIPOS.some(t=>t.k===norm(r.tipo))?norm(r.tipo):"tinto",
    anada:txt(r.anada),uva:txt(r.uva),cuerpo:num(r.cuerpo),pais:txt(r.pais),region:txt(r.region),precioCopa:num(r.precio_copa),precioBotella:num(r.precio_botella),
    notas:txt(r.notas),maridaje:txt(r.maridaje),disponible:txt(r.disponible)===""?true:yes(r.disponible),destacado:yes(r.destacado)}))
    .filter(w=>w.nombre&&w.disponible&&w.precioBotella!=null);
  const cocteles=rows(wb,"cocteles").map((r,i)=>({id:"c"+i,foto:imgUrl(txt(r.foto)),nombre:txt(r.nombre),estilo:txt(r.estilo),base:txt(r.base),sabor:txt(r.sabor),
    ingredientes:txt(r.ingredientes),descripcion:txt(r.descripcion),precio:num(r.precio),disponible:txt(r.disponible)===""?true:yes(r.disponible),destacado:yes(r.destacado)}))
    .filter(c=>c.nombre&&c.disponible);
  const promos=rows(wb,"promociones").map(r=>({imagen:imgUrl(txt(r.imagen)),titulo:txt(r.titulo),descripcion:txt(r.descripcion),precio:txt(r.precio),
    ini:toDate(r.fecha_inicio),fin:toDate(r.fecha_fin),dias:txt(r.dias),hIni:toMin(r.hora_inicio),hFin:toMin(r.hora_fin),activa:yes(r.activa)}))
    .filter(p=>(p.titulo||p.imagen)&&p.activa);
  const splitList=v=>txt(v).split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
  const platillos=rows(wb,"platillos").map((r,i)=>({id:"p"+i,categoria:txt(r.categoria),nombre:txt(r.nombre),descripcion:txt(r.descripcion),precio:num(r.precio),
    vinos:splitList(r.vinos),cocteles:splitList(r.cocteles),foto:imgUrl(txt(r.foto)),disponible:txt(r.disponible)===""?true:yes(r.disponible)}))
    .filter(p=>p.nombre&&p.disponible);
  return {vinos,cocteles,promos,platillos};
}
function imgUrl(v){
  if(!v) return "";
  if(/^https?:\/\//i.test(v)){
    const d=v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/);
    return d?`https://lh3.googleusercontent.com/d/${d[1]}=w1200`:v;
  }
  return v.replace(/^\/+/,"");
}
function toDate(v){ // -> "YYYY-MM-DD" o ""
  if(v===""||v==null) return "";
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10);}
  const s=txt(v); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;}
  return "";
}
function toMin(v){
  if(v===""||v==null) return null;
  if(typeof v==="number"){const f=v%1;return Math.round(f*1440);}
  const m=txt(v).match(/^(\d{1,2})(?::(\d{2}))?/); return m?Number(m[1])*60+Number(m[2]||0):null;
}
async function load(){
  const url=sheetUrl();
  if(!url){ render(); openSetup(); return; }
  try{
    if(!window.XLSX) throw new Error("sin librería");
    const res=await fetch(xlsxUrl(url),{cache:"no-store"});
    if(!res.ok) throw new Error("http "+res.status);
    data=parseWorkbook(await res.arrayBuffer());
    store.set("olivia_cache",JSON.stringify(data));
    $("#offline").hidden=true;
  }catch(e){
    const c=store.get("olivia_cache");
    if(c){ try{data=JSON.parse(c);}catch(_){} $("#offline").hidden=false; }
    else { $("#main").innerHTML=`<p class="notice">No se pudo leer la carta.<br>Revisa la conexión a internet o que la hoja esté publicada en la web.<br><br><button class="btn" id="retry">Reintentar</button></p>`; $("#retry").onclick=load; return; }
  }
  render(); updatePromoBtn();
  if(!promoShownThisGuest && !$("#overlay").innerHTML && activePromos().length){ promoShownThisGuest=true; waitingGuest=false; openPromos(); }
}

  const f=FOTOS[fotoKey(label)]; if(f) return `<img class="photo" src="${f}" alt="">`;

  } else if(e==="cafe"){ // vaso bajo

function renderMap(list){
  if(mapObj){ mapObj.remove(); mapObj=null; }

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:12,opacity:.75}).addTo(mapObj);
  const withR=list.map(w=>({w,r:regionOf(w)}));

    const byP={}; withR.forEach(({w,r})=>{ (byP[r.pais]??=[]).push({w,r}); });

const BASE_ORDEN=["gin","ginebra","tequila","mezcal","vodka","ron","whisky","espumoso","licor","licores","sin_alcohol"];
const BASE_LABEL={gin:"Gin",ginebra:"Gin",tequila:"Tequila",mezcal:"Mezcal",vodka:"Vodka",ron:"Ron",whisky:"Whisky",espumoso:"Espumoso · Spritz",licor:"Licores",licores:"Licores",sin_alcohol:"Sin alcohol"};
const baseKey=b=>{const k=norm(b||"otros"); return k==="ginebra"?"gin":k==="licores"?"licor":k;};
const baseLabel=b=>BASE_LABEL[baseKey(b)]||(b||"Otros");
const baseRank=b=>{const i=BASE_ORDEN.indexOf(baseKey(b)); return i<0?50:i;};
function renderCocktailFilters(){
  const C=data.cocteles;
  const bases=[...new Map(C.map(c=>[baseKey(c.base),c.base])).values()].sort((a,b)=>baseRank(a)-baseRank(b)||baseLabel(a).localeCompare(baseLabel(b)));
  const sabores=[...new Set(C.map(c=>c.sabor).filter(Boolean))].sort();
  const maxP=Math.ceil(Math.max(100,...C.map(c=>c.precio||0))/10)*10;
  if(fc.max!=null&&fc.max>maxP) fc.max=null;
  $("#filters").innerHTML=`
    <div class="fgroup"><h3>Destilado</h3><div class="chips">${bases.map(b=>`<button class="chip" data-k="${esc(baseKey(b))}" data-g="base" aria-pressed="${fc.bases.has(baseKey(b))}">${esc(baseLabel(b))}</button>`).join("")}</div></div>
    <div class="fgroup hide-sm"><h3>Sabor</h3><div class="chips">${sabores.map(s=>`<button class="chip" data-k="${esc(s)}" data-g="sabor" aria-pressed="${fc.sabores.has(s)}"><span class="dot" style="background:${SABOR_COLOR[norm(s)]||"var(--accent)"}"></span>${esc(s)}</button>`).join("")}</div></div>
    ${rangeHtml("cMax","Precio hasta",maxP,fc.max??maxP)}
    <div class="fgroup"><button class="linkbtn" id="fReset">Limpiar filtros</button></div>`;
  chipsBind('[data-g="base"]',fc.bases,renderCocktails);

  $("#cMax").oninput=e=>{fc.max=Number(e.target.value);$("#cMaxOut").textContent=money(fc.max);renderCocktails();};
  $("#fReset").onclick=()=>{fc.bases.clear();resetAll();};
}
function renderCocktails(){
  if(tab!=="cocteles") return;
  const list=data.cocteles.filter(c=>(!fc.bases.size||fc.bases.has(baseKey(c.base)))&&(!fc.sabores.size||fc.sabores.has(c.sabor))
    &&(fc.max==null||(c.precio||0)<=fc.max)&&hasQ([c.nombre,c.estilo,c.base,c.sabor,c.ingredientes,c.descripcion]))
    .sort((a,b)=>baseRank(a.base)-baseRank(b.base)||(b.destacado-a.destacado)||(a.precio||0)-(b.precio||0));
  if(!data.cocteles.length){ $("#main").innerHTML=`<p class="notice">No hay cócteles en la hoja.</p>`; return; }
  const groups=[...new Set(list.map(c=>baseKey(c.base)))];
  const card=c=>`<button class="card" data-id="${c.id}">
      ${c.destacado?'<span class="badge">Favorito</span>':""}
      ${glass(c)}
      <div class="meta">
        <span class="eyebrow">${esc(c.estilo||"")}</span>
        <h4>${esc(c.nombre)}</h4>
        <span class="origen" style="color:var(--muted)">${esc(c.ingredientes)}</span>
        <div class="prices"><div><small>Precio</small>${money(c.precio)}</div></div>
      </div></button>`;
  $("#main").innerHTML=`<div class="summary"><div class="left"><h2>${fc.bases.size===1?esc(baseLabel([...fc.bases][0])):"Coctelería"}</h2><span>${list.length} ${list.length===1?"cóctel":"cócteles"}</span></div></div>
    ${list.length?groups.map(g=>{const items=list.filter(c=>baseKey(c.base)===g);return `<h3 class="bhead">${esc(baseLabel(items[0].base))}<small>${items.length}</small></h3><div class="grid">${items.map(card).join("")}</div>`;}).join("")+`<p class="credit">Fotos ilustrativas: Unsplash.</p>`:empty()}`;
  bindList();
}
function openCocktail(id){
  const c=data.cocteles.find(x=>x.id===id); if(!c) return;
  openOverlay(`${closeBtn}<div class="detail">${glass(c,true)}<div>
    <span class="eyebrow" style="font-size:12px;color:var(--accent)">${esc(c.estilo)}</span>
    <h2>${esc(c.nombre)}</h2>
    ${c.descripcion?`<p style="color:var(--muted)">${esc(c.descripcion)}</p>`:""}
    <dl class="kv">${c.base?`<dt>Destilado</dt><dd>${esc(baseLabel(c.base))}</dd>`:""}${c.sabor?`<dt>Sabor</dt><dd>${esc(c.sabor)}</dd>`:""}</dl>
    ${c.ingredientes?`<h5>Ingredientes</h5><p>${esc(c.ingredientes)}</p>`:""}
    ${dishChips("cocteles",c.nombre)}
    <div class="prices"><div><small>Precio</small>${money(c.precio)}</div></div>
  </div></div>${backToDish()}`);
  bindDishChips();
}

/* ---------- Platillos ---------- */
const CAT_ORDEN=["entradas","ensaladas","pastas_y_risottos","carnes_y_pescados","pizzas","postres"];
const fd={cats:new Set()};
let currentDish=null;
const byName=(arr,name)=>arr.find(x=>fotoKey(x.nombre)===fotoKey(name));
function renderDishFilters(){
  const cats=[...new Set((data.platillos||[]).map(p=>p.categoria).filter(Boolean))].sort((a,b)=>{const ia=CAT_ORDEN.indexOf(norm(a)),ib=CAT_ORDEN.indexOf(norm(b));return (ia<0?99:ia)-(ib<0?99:ib);});
  $("#filters").innerHTML=`<div class="fgroup"><h3>Categoría</h3><div class="chips">${cats.map(c=>`<button class="chip" data-k="${esc(c)}" data-g="cat" aria-pressed="${fd.cats.has(c)}">${esc(c)}</button>`).join("")}</div></div>
    <div class="fgroup"><p style="margin:0;color:var(--muted);font-size:16px;max-width:24ch">Toca un platillo para ver qué vino y cóctel le va mejor.</p></div>
    <div class="fgroup"><button class="linkbtn" id="fReset">Limpiar filtros</button></div>`;
  chipsBind('[data-g="cat"]',fd.cats,renderDishes);
  $("#fReset").onclick=()=>{fd.cats.clear();resetAll();};
}
function renderDishes(){
  if(tab!=="platillos") return;
  const P=data.platillos||[];
  if(!P.length){ $("#main").innerHTML=`<p class="notice">Aún no hay platillos. Agrega la hoja "Platillos" al Google Sheet.</p>`; return; }
  const list=P.filter(p=>(!fd.cats.size||fd.cats.has(p.categoria))&&hasQ([p.nombre,p.categoria,p.descripcion]))
    .sort((a,b)=>CAT_ORDEN.indexOf(norm(a.categoria))-CAT_ORDEN.indexOf(norm(b.categoria)));
  const cats=[...new Set(list.map(p=>p.categoria))];
  $("#main").innerHTML=`<div class="summary"><div class="left"><h2>${fd.cats.size===1?esc([...fd.cats][0]):"Sugerencias del sommelier"}</h2><span>Elige tu platillo y te sugerimos vino y cóctel</span></div></div>
   ${list.length?cats.map(c=>`<h3 style="font-family:var(--cond);font-weight:500;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 12px">${esc(c)}</h3>
   <div class="dlist">${list.filter(p=>p.categoria===c).map(p=>`<button class="drow" data-dish="${p.id}"><span>${esc(p.nombre)}</span><span class="go">Ver maridaje ›</span></button>`).join("")}</div>`).join(""):empty()}`;
  $("#main").querySelectorAll("[data-dish]").forEach(b=>b.onclick=()=>openDish(b.dataset.dish));
  const er=$("#emptyReset"); if(er) er.onclick=()=>{fd.cats.clear();resetAll();};
}
function cocktailImg(c,big){
  if(c.foto) return c.foto;
  const cf=COCTEL_FOTOS[fotoKey(c.nombre)];
  return cf?`https://images.unsplash.com/${cf}?w=${big?420:160}&h=${big?600:160}&fit=crop&auto=format&q=70`:"";
}
function openDish(id){
  const p=(data.platillos||[]).find(x=>x.id===id); if(!p) return;
  currentDish=p.id;
  const ws=p.vinos.map(n=>byName(data.vinos,n)).filter(Boolean);
  const cs=p.cocteles.map(n=>byName(data.cocteles,n)).filter(Boolean);
  openOverlay(`${closeBtn}
    ${p.foto?`<img class="dish-img" src="${esc(p.foto)}" alt="">`:""}
    <div class="dish-head"><div><span class="eyebrow" style="font-size:13px;color:var(--accent)">${esc(p.categoria)} · Maridaje</span><h2>${esc(p.nombre)}</h2><p>${esc(p.descripcion)}</p></div></div>
    ${ws.length?`<div class="pair-sec"><h5>Vinos que maridan</h5><div class="prow">${ws.map(w=>`<button class="pcard" data-w="${w.id}"><div class="b">${bottle(w.tipo,w.nombre,w.foto)}</div><div><b>${esc(w.nombre)}</b><span>${tipoOf(w.tipo).label} · ${esc(w.uva)}</span><div class="pr">${w.precioCopa?`Copa ${money(w.precioCopa)} · `:""}${money(w.precioBotella)}</div></div></button>`).join("")}</div></div>`:""}
    ${cs.length?`<div class="pair-sec"><h5>Cócteles que maridan</h5><div class="prow">${cs.map(c=>`<button class="pcard" data-c="${c.id}"><div class="b">${cocktailImg(c)?`<img class="cphoto" src="${cocktailImg(c)}" alt="">`:glassSvg(c)}</div><div><b>${esc(c.nombre)}</b><span>${esc(c.ingredientes)}</span><div class="pr">${money(c.precio)}</div></div></button>`).join("")}</div></div>`:""}
  `,"sheet");
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>openWine(b.dataset.w));
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openCocktail(b.dataset.c));
}
function dishChips(field,name){
  const ds=(data.platillos||[]).filter(p=>p[field].some(n=>fotoKey(n)===fotoKey(name)));
  if(!ds.length) return "";
  return `<h5>Marida con</h5><div class="dchips">${ds.map(d=>`<button class="dchip" data-dishchip="${d.id}">${esc(d.nombre)}</button>`).join("")}</div>`;
}
function bindDishChips(){ document.querySelectorAll("[data-dishchip]").forEach(b=>b.onclick=()=>openDish(b.dataset.dishchip)); }
function backToDish(){
  const p=currentDish&&(data.platillos||[]).find(x=>x.id===currentDish);
  return p?`<button class="backdish" onclick="window.__openDish('${p.id}')">‹ Volver a ${esc(p.nombre)}</button>`:"";
}
window.__openDish=id=>openDish(id);

/* ---------- Promociones ---------- */
const DIAS=["dom","lun","mar","mie","jue","vie","sab"];
function activePromos(){
  const now=new Date(), today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const mins=now.getHours()*60+now.getMinutes(), dia=DIAS[now.getDay()];
  return (data.promos||[]).filter(p=>{
    if(p.ini&&today<p.ini) return false;
    if(p.fin&&today>p.fin) return false;
    if(p.dias&&!/todos/i.test(p.dias)){ const ds=p.dias.split(/[,\s]+/).map(d=>norm(d).slice(0,3)); if(!ds.includes(dia)) return false; }
    if(p.hIni!=null&&p.hFin!=null){ const inRange=p.hIni<=p.hFin?(mins>=p.hIni&&mins<p.hFin):(mins>=p.hIni||mins<p.hFin); if(!inRange) return false; }
    return true;
  });
}
function whenText(p){
  const parts=[];
  if(p.dias&&!/todos/i.test(p.dias)) parts.push(p.dias.replace(/,\s*/g,", "));
  const hm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
  if(p.hIni!=null&&p.hFin!=null) parts.push(`${hm(p.hIni)}–${hm(p.hFin)} h`);
  if(p.fin){const [y,m,d]=p.fin.split("-");parts.push(`hasta el ${Number(d)}/${Number(m)}`);}
  return parts.join(" · ");
}
function updatePromoBtn(){ const n=activePromos().length; $("#promoBtn").hidden=!n; }
let promoShownThisGuest=false, promoTimer=null;
const PROMO_MS=4000;
function openPromos(){
  const P=activePromos(); if(!P.length) return;
  let i=0;
  const next=()=>{ i++; if(i>=P.length){ closeOverlay(); } else paint(); };
  const paint=()=>{
    const p=P[i];
    const body=p.imagen?`<img class="promo-img" src="${esc(p.imagen)}" alt="${esc(p.titulo||"Promoción")}">`
      :`<div class="promo-txt"><span class="eyebrow">Promoción</span>${p.titulo?`<h2>${esc(p.titulo)}</h2>`:""}${p.descripcion?`<p>${esc(p.descripcion)}</p>`:""}${p.precio?`<div class="price">${esc(p.precio)}</div>`:""}</div>`;
    openOverlay(`<button class="promo-x close" aria-label="Cerrar">✕</button>${body}<div class="promo-bar"><i></i></div>`,"promo-card");
    const card=$(".promo-card"); card.onclick=e=>{ if(!e.target.closest(".promo-x")) next(); };
    const bar=$(".promo-bar i"); requestAnimationFrame(()=>{ bar.style.transition=`width ${PROMO_MS}ms linear`; bar.style.width="100%"; });
    clearTimeout(promoTimer); promoTimer=setTimeout(next,PROMO_MS);
  };
  paint();
}

/* ---------- Overlay ---------- */
function openOverlay(html,cls="sheet"){
  $("#overlay").innerHTML=`<div class="scrim" id="scrim"><div class="${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")closeOverlay();};
  const c=$("#overlay .close"); if(c) c.onclick=closeOverlay;
}
function closeOverlay(){ $("#overlay").innerHTML=""; clearInterval(promoTimer); clearTimeout(promoTimer); currentDish=null; }
const closeBtn=`<button class="btn icon close" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;

/* ---------- Configuración (mantener presionado el logo 3 s) ---------- */
function openSetup(){
  openOverlay(`<h2>Conectar la carta</h2>
    <ol><li>En Google Sheets: Archivo → Compartir → Publicar en la web.</li><li>Elige "Documento completo" y "Microsoft Excel (.xlsx)". Publica.</li><li>Copia el enlace y pégalo aquí.</li></ol>
    <label for="sheetUrl" style="font-size:12px;color:var(--muted)">Enlace de la hoja</label>
    <input id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=xlsx" value="${esc(sheetUrl())}">
    <div class="err" id="setupErr"></div>
    <div class="actions">${sheetUrl()?'<button class="btn" id="setupCancel">Cancelar</button>':""}<button class="btn primary" id="setupSave">Guardar y cargar</button></div>`,"sheet setup");
  const cancel=$("#setupCancel"); if(cancel) cancel.onclick=closeOverlay;
  $("#setupSave").onclick=async()=>{
    const u=$("#sheetUrl").value.trim();
    if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u)){ $("#setupErr").textContent="Pega un enlace de Google Sheets."; return; }
    $("#setupSave").disabled=true; $("#setupErr").textContent="Probando…";
    try{
      if(!window.XLSX) throw 0;
      const r=await fetch(xlsxUrl(u),{cache:"no-store"}); if(!r.ok) throw 0;
      const d=parseWorkbook(await r.arrayBuffer()); if(!d.vinos.length&&!d.cocteles.length) throw 0;
      store.set("olivia_sheet_url",u); closeOverlay(); promoShownThisGuest=false; load();
    }catch(e){ $("#setupSave").disabled=false; $("#setupErr").textContent="No se pudo leer. Revisa que la hoja esté publicada en la web como .xlsx y tenga las hojas Vinos y Cocteles."; }
  };
}
let pressT;
$("#brand").addEventListener("pointerdown",()=>{pressT=setTimeout(openSetup,3000);});
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("#brand").addEventListener(ev,()=>clearTimeout(pressT)));
$("#brand").addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- Eventos ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ if(tab===t.dataset.tab) return; tab=t.dataset.tab; q=""; $("#q").value=""; $("#main").scrollTop=0; render(); });
$("#q").addEventListener("input",e=>{q=e.target.value; tab==="vinos"?renderWines():tab==="cocteles"?renderCocktails():renderDishes();});
$("#promoBtn").onclick=openPromos;

/* Modo kiosco: tras 2 min sin uso vuelve al inicio y muestra la promoción al siguiente cliente */
let idleT;
function bump(){ clearTimeout(idleT); idleT=setTimeout(()=>{ if($("#sheetUrl")) return; closeOverlay(); tab="vinos"; view="cava"; mapState={level:"pais"}; resetAll(); $("#main").scrollTop=0; promoShownThisGuest=false; waitingGuest=true; },IDLE_MS); }
let waitingGuest=false;
document.addEventListener("pointerdown",()=>{ if(waitingGuest){ waitingGuest=false; if(activePromos().length){ promoShownThisGuest=true; setTimeout(openPromos,50);} } },{capture:true});
["pointerdown","keydown","scroll"].forEach(ev=>document.addEventListener(ev,bump,{passive:true,capture:true}));

setInterval(()=>{ updatePromoBtn(); },60000);
setInterval(()=>{ if(!$("#overlay").innerHTML) load(); },REFRESH_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&!$("#overlay").innerHTML) load(); });

load(); bump();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
/* Si no se abrió como app instalada, pantalla completa al primer toque */
if(!matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches){ document.addEventListener("pointerdown",()=>{ const el=document.documentElement; if(!document.fullscreenElement&&el.requestFullscreen) el.requestFullscreen().catch(()=>{}); },{once:true}); }
})();
</script>
